plugins {
    id 'com.android.application'
}

android {
    namespace 'com.corporatedragon.odyssey'
    compileSdk 34

    defaultConfig {
        applicationId "com.corporatedragon.odyssey"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'

    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'align kotlin-stdlib-jdk7 with kotlin-stdlib 1.8.22 to avoid duplicate classes'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'align kotlin-stdlib-jdk8 with kotlin-stdlib 1.8.22 to avoid duplicate classes'
        }
    }
}
