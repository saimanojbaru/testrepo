name: Sortora Android

on:
  push:
    paths:
      - "Sortora/**"
      - ".github/workflows/sortora-android.yml"
  pull_request:
    paths:
      - "Sortora/**"
      - ".github/workflows/sortora-android.yml"
  workflow_dispatch:

concurrency:
  group: sortora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Sortora
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Unit tests, the "no INTERNET permission" privacy check, lint, and a debug APK.
      - name: Test, lint and build
        run: ./gradlew --no-configuration-cache testDebugUnitTest lintDebug assembleDebug

      # One APK per CPU type. Almost every current phone needs the arm64-v8a one.
      - name: Upload debug APKs
        uses: actions/upload-artifact@v6
        with:
          name: sortora-debug-apks
          path: Sortora/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sortora-reports
          path: |
            Sortora/app/build/reports/
            Sortora/app/build/test-results/
          if-no-files-found: ignore
