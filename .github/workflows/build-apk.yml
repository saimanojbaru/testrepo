name: build-apk

on:
  push:
    branches: ["**"]
    paths:
      - "insurance_intelligence_pro/frontend/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance_intelligence_pro/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze (non-blocking info hints)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: insurance-intelligence-pro-apk
          path: |
            insurance_intelligence_pro/frontend/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
