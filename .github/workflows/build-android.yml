name: Build Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

jobs:
  android:
    name: Export debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage Godot assets into $HOME
        run: |
          mkdir -p "$HOME/.local/share/godot"
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -r /root/.local/share/godot/export_templates "$HOME/.local/share/godot/"
          fi
          echo "--- export_templates contents ---"
          ls "$HOME/.local/share/godot/export_templates/" || true
          ls "$HOME/.local/share/godot/export_templates/4.3.stable/" || true

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores"
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey -keypass android \
            -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999

      - name: Configure Godot editor settings
        run: |
          JAVA_BIN="$(readlink -f "$(which java)")"
          JAVA_HOME_DETECTED="${JAVA_BIN%/bin/java}"
          echo "Detected JAVA_HOME: $JAVA_HOME_DETECTED"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "$JAVA_HOME_DETECTED"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "--- editor_settings-4.3.tres ---"
          cat "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Verify export prerequisites
        run: |
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk" \
            || (echo "::error::Missing android_debug.apk template" && exit 1)
          test -f "$HOME/.local/share/godot/keystores/debug.keystore" \
            || (echo "::error::Missing debug keystore" && exit 1)
          test -f "$HOME/.config/godot/editor_settings-4.3.tres" \
            || (echo "::error::Missing editor_settings" && exit 1)
          echo "All export prerequisites present."

      - name: Import project resources
        run: |
          mkdir -p build/android
          godot --headless --import || true
          # Second pass — Godot 4.3 sometimes needs two import runs for fresh checkouts.
          godot --headless --import

      - name: Export debug APK
        run: |
          godot --headless --export-debug "Android" build/android/corporate-dragon-debug.apk

      - name: Show APK info
        run: |
          ls -lh build/android/
          file build/android/corporate-dragon-debug.apk || true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: corporate-dragon-debug-apk
          path: build/android/corporate-dragon-debug.apk
          if-no-files-found: error
          retention-days: 30
