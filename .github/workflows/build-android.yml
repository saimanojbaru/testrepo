name: Build Android APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

jobs:
  android:
    name: Export debug APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate debug keystore
        run: |
          mkdir -p /root/.local/share/godot/keystores
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey -keypass android \
            -keystore /root/.local/share/godot/keystores/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999

      - name: Configure Godot editor settings
        run: |
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.3.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project resources
        run: |
          mkdir -p build/android
          godot --headless --import || true
          # Second pass — Godot 4.3 sometimes needs two import runs for fresh checkouts.
          godot --headless --import

      - name: Export debug APK
        run: |
          godot --headless --export-debug "Android" build/android/corporate-dragon-debug.apk

      - name: Show APK info
        run: |
          ls -lh build/android/
          file build/android/corporate-dragon-debug.apk || true

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: corporate-dragon-debug-apk
          path: build/android/corporate-dragon-debug.apk
          if-no-files-found: error
          retention-days: 30
