name: content_studio
description: One-Stop Content Studio — orchestrates Claude, ElevenLabs, and DALL-E into a single on-device short-form video pipeline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.4
  ffmpeg_kit_flutter_new: ^4.1.0        # maintained fork hosting GPL binaries
  video_player: ^2.9.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
