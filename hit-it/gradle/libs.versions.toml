# Version catalog — single source of truth for "Hit it" build dependencies.
# Verified mutually-compatible stable versions as of 2026-05-29.
# Plugin versions are declared per-module via these aliases (no apply-false root block),
# which keeps the pure-JVM :domain module buildable without the Android Gradle Plugin.

[versions]
# --- Build / language ---
agp = "8.13.0"            # latest AGP 8.x; min Gradle 8.13, min JDK 17, max compileSdk 36.1
kotlin = "2.3.21"         # latest stable Kotlin
ksp = "2.3.9"             # latest KSP (unified versioning, KSP2); tracks Kotlin 2.3.x
# Gradle WRAPPER is pinned in gradle/wrapper/gradle-wrapper.properties to 8.14.3.

# --- AndroidX core / lifecycle / nav ---
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"

# --- Compose ---
composeBom = "2026.05.00" # -> ui/foundation/runtime 1.11.2, material3 1.4.0

# --- DI ---
hilt = "2.57.1"
hiltNavigationCompose = "1.3.0"
androidxHilt = "1.3.0"

# --- Persistence ---
room = "2.8.4"            # KSP processor; do NOT use Room 3.0 for this MVP

# --- Async ---
coroutines = "1.11.0"

# --- Background ---
work = "2.11.2"

# --- Widgets ---
glance = "1.1.1"          # latest stable Glance; Compose BOM overrides its older transitive runtime

# --- Testing ---
junit4 = "4.13.2"
androidxTest = "1.7.0"          # androidx.test runner + core
androidxTestExtJunit = "1.3.0"  # androidx.test.ext:junit (versioned independently)
# coroutines-test reuses the `coroutines` version ref above.

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" } # MUST equal kotlin version
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[libraries]
# Compose (versions come from the BOM)
compose-bom                = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui                 = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics        = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling         = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation         = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3          = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons     = { group = "androidx.compose.material", name = "material-icons-extended" }

# Lifecycle
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Activity / Nav / Core
activity-compose   = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
core-ktx           = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Hilt
hilt-android            = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work      = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler  = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }

# Room
room-runtime  = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx      = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Coroutines
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# WorkManager
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Glance (home-screen widgets)
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

# Testing
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner    = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-core      = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
