<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050807">
<title>Hyderabad Atlas</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" data-mode="explore">
  <div id="map"></div>
  <div id="vignette"></div>
  <div id="labels"></div>
  <canvas id="fx"></canvas>
  <div id="attrib">Imagery © Esri, Maxar, Earthstar · Data © OpenStreetMap</div>

  <header id="topbar">
    <div class="brand">
      <span class="brand-top">hyderabad</span>
      <span class="brand-bot">atlas</span>
    </div>
    <div class="top-right">
      <div id="xp-chip" class="chip-stat" title="XP"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>0</span></div>
      <div id="streak-chip" class="chip-stat" title="Day streak"><svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-4 1-6 1-9z"/></svg><span>0</span></div>
      <button id="btn-search" class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
    </div>
  </header>

  <div id="headline">
    <div class="kicker"></div>
    <div class="title"></div>
    <div class="sub"></div>
  </div>

  <div id="map-tools">
    <button class="tool" data-tool="recenter" aria-label="Recentre"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
    <button class="tool" data-tool="tilt" aria-label="3D"><span>3D</span></button>
    <button class="tool" data-tool="roads" aria-label="Roads"><svg viewBox="0 0 24 24"><path d="M8 3 5 21M16 3l3 18M12 4v3M12 10v3M12 16v3"/></svg></button>
    <button class="tool" data-tool="labels" aria-label="Labels"><svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg></button>
  </div>

  <!-- EXPLORE -->
  <section id="explore" class="panel">
    <div id="depth-bar" class="hscroll"></div>
    <div id="info-card" class="glass card" hidden></div>
  </section>

  <!-- SHEETS -->
  <section id="sheet" class="sheet glass" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-body"></div>
  </section>

  <!-- TOUR -->
  <section id="tour" class="overlay" hidden>
    <div class="ov-top">
      <button class="icon-btn" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="dots"></div>
      <button class="text-btn" data-act="skip">Quiz</button>
    </div>
    <div class="tour-card glass">
      <div class="kicker"></div>
      <div class="t-title"></div>
      <div class="t-crumb"></div>
      <div class="t-fact"></div>
      <div class="tour-ctrl">
        <button class="btn ghost" data-act="prev">Back</button>
        <button class="btn primary" data-act="next">Next</button>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="overlay" hidden>
    <div class="ov-top">
      <button class="icon-btn" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="qbar"><div class="qbar-fill"></div></div>
      <div class="qscore">0</div>
    </div>
    <div class="q-card glass">
      <div class="kicker"></div>
      <div class="q-prompt"></div>
      <div class="q-sub"></div>
    </div>
    <div class="q-bottom">
      <div class="q-feedback" hidden></div>
      <div class="q-answers"></div>
    </div>
  </section>

  <nav id="tabbar">
    <button data-tab="explore" class="on"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span>Explore</span></button>
    <button data-tab="learn"><svg viewBox="0 0 24 24"><path d="M5 19a2 2 0 1 0 0-.1zM19 5a2 2 0 1 0 0-.1zM7 18c6 0 3-6 9-6M17 6c-4 0-4 6-8 6"/></svg><span>Learn</span></button>
    <button data-tab="play"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5M15 11h.01M18 13.5h.01"/></svg><span>Play</span></button>
    <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7a5 5 0 1 0 5 5"/><path d="M12 12 20 4"/></svg><span>Progress</span></button>
  </nav>

  <div id="search" class="glass" hidden>
    <div class="search-row">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="search-input" type="search" placeholder="Search areas, circles, landmarks, stations" autocomplete="off">
      <button class="text-btn" data-act="close">Cancel</button>
    </div>
    <div id="search-results"></div>
  </div>

  <div id="toast" hidden></div>

  <div id="splash">
    <div class="splash-inner">
      <div class="splash-logo">hyderabad<b>atlas</b></div>
      <div class="splash-line">One city. <em>Three corporations.</em></div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>
</div>
<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
